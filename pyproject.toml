[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "borrowed-light"
version = "0.1.0"
description = "Transfer-penalty estimation for borrowed correlates of protection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Reading .rda releases such as HVTN 505 from the CRAN `vaccine` package.
rda = ["pyreadr>=0.5"]

[tool.setuptools]
packages = ["penalty", "sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# experiments/ is run from the checkout, not installed.
pythonpath = ["."]
addopts = "-q"
